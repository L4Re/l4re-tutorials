inherit: [ "rootfs::cpio" ]

depends:
    - libs::libc-tgt
    - core::busybox

checkoutSCM:
  scm: import
  url: recipes/examples/guests/linux-initramfs

buildTools: [target-toolchain]
buildVars: [SYSROOT]
buildScript: |
    # Copy the dependencies first and our own files ("$1") last, to overwrite
    # busybox's versions of /etc/inittab and /etc/init.d/rcS.
    rootfsCopy "$PWD/install" "${@:2}" "$1"

    mkdir -p install/{dev,etc/init.d,proc,sys}
    ln -sf bin/busybox install/init

    CREATE_SH_FILE= rootfsCpioCreateImage install/ initramfs

packageTools: [cpio]
packageScript: |
    cp "$1/initramfs.cpio.gz" .
